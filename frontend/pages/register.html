<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Student Account | F-TECH-Student-Hub</title>
  <meta name="description" content="Join F-TECH-Student-Hub to access AKTU PYQs, notes, tutorials and lab resources. Founded by Aditya Kumar Sharma (F-TECH).">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <style>
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.15), transparent 40%),
                  radial-gradient(circle at 85% 80%, rgba(6, 182, 212, 0.12), transparent 45%),
                  var(--bg-primary);
    }
    [data-theme="light"] .auth-page-wrapper {
      background: radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.08), transparent 40%),
                  radial-gradient(circle at 85% 80%, rgba(6, 182, 212, 0.06), transparent 45%),
                  #f1f5f9;
    }
    .auth-card {
      width: 100%;
      max-width: 480px;
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      padding: 2.5rem 2rem;
      box-shadow: var(--shadow-xl);
      backdrop-filter: blur(16px);
      position: relative;
    }
    [data-theme="light"] .auth-card {
      background: #ffffff !important;
      border: 1.5px solid #e2e8f0 !important;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.08) !important;
      color: #0f172a !important;
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 1.75rem;
    }
    .auth-logo-badge {
      width: 54px;
      height: 54px;
      border-radius: var(--radius-md);
      background: var(--grad-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
      margin: 0 auto 1rem;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
    }
    .auth-brand h2 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
      color: var(--text-main);
    }
    [data-theme="light"] .auth-brand h2 {
      color: #0f172a !important;
    }
    .auth-brand p {
      font-size: 0.88rem;
      color: var(--text-muted);
    }
    [data-theme="light"] .auth-brand p {
      color: #334155 !important;
    }
    .auth-info-box {
      background: rgba(99, 102, 241, 0.08);
      border: 1px dashed rgba(99, 102, 241, 0.3);
      border-radius: var(--radius-sm);
      padding: 0.75rem 1rem;
      font-size: 0.82rem;
      color: var(--text-main);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    [data-theme="light"] .auth-info-box {
      background: #eef2ff !important;
      border: 1px dashed #818cf8 !important;
      color: #1e1b4b !important;
    }
  </style>
</head>
<body class="auth-page-wrapper">
  <div class="auth-card">
    <div style="position: absolute; top: 1.25rem; right: 1.25rem;">
      <button id="themeToggleBtn" class="icon-btn" title="Toggle Theme" aria-label="Toggle theme">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      </button>
    </div>

    <div class="auth-brand">
      <div class="auth-logo-badge">FT</div>
      <h2>Join F-TECH Student-Hub</h2>
      <p>Company: <strong>F-TECH</strong> • Founder: <strong>Aditya Kumar Sharma</strong></p>
    </div>

    <div class="auth-info-box">
      <span>ℹ️</span>
      <span>After registration, you will be redirected to the <strong>Login</strong> page to sign in to the app.</span>
    </div>

    <form id="ftechRegisterForm" onsubmit="handleStandaloneRegister(event)">
      <div class="form-group">
        <label for="regFullName">Full Name *</label>
        <input type="text" id="regFullName" class="form-control" placeholder="e.g. Alok Vishwakarma" required>
      </div>

      <div class="form-group">
        <label for="regEmail">College or Personal Email *</label>
        <input type="email" id="regEmail" class="form-control" placeholder="alok.vishwakarma@college.edu" required>
      </div>

      <div class="form-group">
        <label for="regPassword">Create Password *</label>
        <input type="password" id="regPassword" class="form-control" placeholder="At least 6 characters" required>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
        <div class="form-group">
          <label for="regBranch">Branch</label>
          <select id="regBranch" class="form-control">
            <option value="CSE" selected>CSE / IT</option>
            <option value="ECE">ECE</option>
            <option value="ME">Mechanical</option>
            <option value="Civil">Civil</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="regSemester">Semester</label>
          <select id="regSemester" class="form-control">
            <option value="1">Sem 1</option>
            <option value="2">Sem 2</option>
            <option value="3" selected>Sem 3</option>
            <option value="4">Sem 4</option>
            <option value="5">Sem 5</option>
            <option value="6">Sem 6</option>
            <option value="7">Sem 7</option>
            <option value="8">Sem 8</option>
          </select>
        </div>
      </div>

      <button type="submit" id="regSubmitBtn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
        Create Account & Proceed to Login
      </button>

      <div style="text-align: center; font-size: 0.88rem; color: var(--text-muted); margin-top: 1.25rem;">
        Already registered? <a href="login.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Sign In here</a>
      </div>

      <div style="text-align: center; margin-top: 1rem; border-top: 1px solid var(--border-glass); padding-top: 0.75rem;">
        <a href="../index.html" style="font-size: 0.82rem; color: var(--text-dim); text-decoration: none;">
          &larr; Back to Student-Hub Home
        </a>
      </div>
    </form>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      FTechApp.initTheme();

      const user = FTechApp.getCurrentUser();
      const token = localStorage.getItem('ftech_token');
      if (user && token) {
        if (user.role === 'SuperAdmin' || user.role === 'Admin' || user.isAdmin) {
          window.location.replace('../admin/dashboard.html');
        } else {
          window.location.replace('../index.html');
        }
      }
    });

    async function handleStandaloneRegister(e) {
      e.preventDefault();
      const fullName = document.getElementById('regFullName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const branch = document.getElementById('regBranch').value;
      const semester = document.getElementById('regSemester').value;
      const btn = document.getElementById('regSubmitBtn');

      if (password.length < 6) {
        FTechApp.showToast('Password must be at least 6 characters.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Registering account...';

      const res = await FTechApp.apiCall('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fullName, email, password, branch, semester })
      });

      btn.disabled = false;
      btn.textContent = 'Create Account & Proceed to Login';

      if (res.success) {
        FTechApp.showToast('Account created successfully! Redirecting to login...', 'success');
        setTimeout(() => {
          window.location.href = `login.html?registered=1&email=${encodeURIComponent(email)}`;
        }, 800);
      } else {
        FTechApp.showToast(res.message || 'Registration failed', 'error');
      }
    }
  </script>
</body>
</html>
