<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Sign-In | F-TECH-Student-Hub</title>
  <meta name="description" content="Sign in to your F-TECH-Student-Hub account to access AKTU notes, PYQs, and lab codes. Founded by Aditya Kumar Sharma.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <style>
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: radial-gradient(circle at 85% 20%, rgba(99, 102, 241, 0.15), transparent 40%),
                  radial-gradient(circle at 15% 80%, rgba(16, 185, 129, 0.12), transparent 45%),
                  var(--bg-primary);
    }
    [data-theme="light"] .auth-page-wrapper {
      background: radial-gradient(circle at 85% 20%, rgba(99, 102, 241, 0.08), transparent 40%),
                  radial-gradient(circle at 15% 80%, rgba(16, 185, 129, 0.06), transparent 45%),
                  #f1f5f9;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      padding: 2.5rem 2rem;
      box-shadow: var(--shadow-xl);
      backdrop-filter: blur(16px);
      position: relative;
    }
    [data-theme="light"] .auth-card {
      background: #ffffff !important;
      border: 1.5px solid #e2e8f0 !important;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.08) !important;
      color: #0f172a !important;
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 1.75rem;
    }
    .auth-logo-badge {
      width: 54px;
      height: 54px;
      border-radius: var(--radius-md);
      background: var(--grad-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
      margin: 0 auto 1rem;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
    }
    .auth-brand h2 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
      color: var(--text-main);
    }
    [data-theme="light"] .auth-brand h2 {
      color: #0f172a !important;
    }
    .auth-brand p {
      font-size: 0.88rem;
      color: var(--text-muted);
    }
    [data-theme="light"] .auth-brand p {
      color: #334155 !important;
    }
    .success-alert {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
      font-size: 0.85rem;
      color: var(--accent-emerald);
      margin-bottom: 1.5rem;
      display: none;
      align-items: center;
      gap: 0.75rem;
      line-height: 1.4;
    }
    [data-theme="light"] .success-alert {
      background: #dcfce7 !important;
      border: 1px solid #86efac !important;
      color: #14532d !important;
    }
  </style>
</head>
<body class="auth-page-wrapper">
  <div class="auth-card">
    <div style="position: absolute; top: 1.25rem; right: 1.25rem;">
      <button id="themeToggleBtn" class="icon-btn" title="Toggle Theme" aria-label="Toggle theme">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      </button>
    </div>

    <div class="auth-brand">
      <div class="auth-logo-badge">FT</div>
      <h2>Sign In to Student-Hub</h2>
      <p>Company: <strong>F-TECH</strong> • Founder: <strong>Aditya Kumar Sharma</strong></p>
    </div>

    <!-- Banner shown if redirected from register -->
    <div id="registrationSuccessAlert" class="success-alert">
      <span style="font-size: 1.25rem;">🎉</span>
      <div>
        <strong>Registration Successful!</strong><br>
        Please enter your password to sign in and enter the app.
      </div>
    </div>

    <form id="ftechLoginForm" onsubmit="handleStandaloneLogin(event)">
      <div class="form-group">
        <label for="loginEmail">Email Address or Username *</label>
        <input type="text" id="loginEmail" class="form-control" placeholder="alok.vishwakarma@college.edu or username" required>
      </div>

      <div class="form-group">
        <label for="loginPassword">Password *</label>
        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••••••" required>
      </div>

      <button type="submit" id="loginSubmitBtn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
        Sign In & Enter App
      </button>

      <div style="text-align: center; font-size: 0.88rem; color: var(--text-muted); margin-top: 1.25rem;">
        Need an account? <a href="register.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Create one here</a>
      </div>

      <div style="text-align: center; margin-top: 1rem; border-top: 1px solid var(--border-glass); padding-top: 0.75rem;">
        <a href="../index.html" style="font-size: 0.82rem; color: var(--text-dim); text-decoration: none;">
          &larr; Back to Student-Hub Home
        </a>
      </div>
    </form>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      FTechApp.initTheme();

      const user = FTechApp.getCurrentUser();
      const token = localStorage.getItem('ftech_token');
      if (user && token) {
        const isAdmin = user.role === 'SuperAdmin' || user.role === 'Admin' || user.isAdmin;
        if (isAdmin) {
          window.location.replace('../admin/dashboard.html');
          return;
        }
      }

      const urlParams = new URLSearchParams(window.location.search);
      const isRegistered = urlParams.get('registered');
      const email = urlParams.get('email');

      if (isRegistered === '1') {
        const alertBox = document.getElementById('registrationSuccessAlert');
        if (alertBox) {
          alertBox.style.display = 'flex';
        }
      }

      if (email) {
        const emailInput = document.getElementById('loginEmail');
        if (emailInput) {
          emailInput.value = email;
          const passInput = document.getElementById('loginPassword');
          if (passInput) passInput.focus();
        }
      }
    });

    async function handleStandaloneLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginSubmitBtn');

      btn.disabled = true;
      btn.textContent = 'Authenticating...';

      const res = await FTechApp.apiCall('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      btn.disabled = false;
      btn.textContent = 'Sign In & Enter App';

      if (res.success && res.user) {
        FTechApp.setCurrentUser(res.user, res.token);
        const isAdmin = res.isAdmin === true || res.user.role === 'SuperAdmin' || res.user.role === 'Admin';

        if (isAdmin) {
          localStorage.setItem('ftech_admin_token', res.token);
          localStorage.setItem('ftech_admin_user', JSON.stringify(res.user));
          localStorage.setItem('ftech_user', JSON.stringify(res.user));
          localStorage.setItem('ftech_token', res.token);
          FTechApp.showToast(`Welcome Administrator, ${res.user.fullName}! Opening Admin Dashboard...`, 'success');
          setTimeout(() => {
            window.location.href = '../admin/dashboard.html';
          }, 500);
        } else {
          FTechApp.showToast(`Welcome back, ${res.user.fullName}! Entering Student-Hub...`, 'success');
          setTimeout(() => {
            window.location.href = '../index.html';
          }, 500);
        }
      } else {
        FTechApp.showToast(res.message || 'Invalid credentials', 'error');
      }
    }
  </script>
</body>
</html>
